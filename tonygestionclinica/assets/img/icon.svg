<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tony Gallardo Gestión Clínica">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#075985"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <clipPath id="marco">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#marco)">
    <rect width="512" height="512" fill="url(#fondo)"/>

    <!-- Sol tras la pieza, como en el logo del centro -->
    <circle cx="256" cy="232" r="170" fill="#ffffff" fill-opacity="0.12"/>

    <!-- Molar: corona ancha y horquilla de raices visible sobre el agua -->
    <path fill="#ffffff" d="M140 168
      C140 104 196 84 256 116
      C316 84 372 104 372 168
      C372 222 358 258 348 300
      C338 350 328 420 298 420
      C274 420 270 356 256 324
      C242 356 238 420 214 420
      C184 420 174 350 164 300
      C154 258 140 222 140 168Z"/>

    <!-- Olas: el diente emerge del agua, como la mano del logo -->
    <path fill="#0ea5e9" stroke="#ffffff" stroke-width="14" stroke-linejoin="round"
          d="M-20 396 C76 356 168 436 256 396 C344 356 436 436 532 396 V532 H-20Z"/>
    <path fill="#0369a1" stroke="#ffffff" stroke-width="14" stroke-linejoin="round"
          d="M-20 462 C76 422 168 502 256 462 C344 422 436 502 532 462 V532 H-20Z"/>
  </g>
</svg>
